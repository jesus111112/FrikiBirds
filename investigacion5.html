<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciencia, Tecnología y Sociedad</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d0d14;
    --cream: #f5f0e8;
    --gold: #c9a84c;
    --gold-light: #e8c96e;
    --rust: #b84a2f;
    --teal: #1a6b6b;
    --blue-deep: #0f2a4a;
    --white: #ffffff;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Raleway', sans-serif; background: var(--ink); color: var(--cream); overflow-x: hidden; }

  /* ── PROGRESS BAR ── */
  .progress-bar {
    position: fixed; top: 0; left: 0; height: 2px;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    width: 0%; z-index: 9999; transition: width 0.1s linear;
  }

  /* ── COVER ── */
  .cover {
    min-height: 100vh; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    position: relative; overflow: hidden;
    background: var(--blue-deep); text-align: center; padding: 2rem;
  }
  .cover::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 20% 30%, rgba(201,168,76,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 80% 70%, rgba(26,107,107,0.22) 0%, transparent 55%);
  }
  .grid-lines {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(201,168,76,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(201,168,76,0.07) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .cover-label { font-size:.75rem; font-weight:700; letter-spacing:.4em; text-transform:uppercase; color:var(--gold); margin-bottom:2rem; position:relative; animation:fadeDown .8s ease both; }
  .cover h1 { font-family:'Playfair Display',serif; font-size:clamp(2.8rem,7vw,6rem); font-weight:900; line-height:1; position:relative; animation:fadeUp 1s .2s ease both; }
  .cover h1 em { font-style:italic; color:var(--gold-light); display:block; }
  .cover-divider { width:80px; height:2px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:2rem auto; position:relative; animation:fadeUp 1s .4s ease both; }
  .cover-subtitle { font-size:1.05rem; font-weight:300; letter-spacing:.08em; color:rgba(245,240,232,.7); max-width:560px; line-height:1.7; position:relative; animation:fadeUp 1s .5s ease both; }
  .pillars { display:flex; gap:1.5rem; margin-top:3rem; position:relative; animation:fadeUp 1s .7s ease both; flex-wrap:wrap; justify-content:center; }
  .pillar-tag { border:1px solid rgba(201,168,76,.4); padding:.4rem 1.2rem; border-radius:2px; font-size:.72rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold-light); }
  .scroll-hint { position:absolute; bottom:2.5rem; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:.5rem; color:rgba(245,240,232,.4); font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; animation:bob 2s infinite ease-in-out; }
  .scroll-hint::after { content:''; width:1px; height:40px; background:linear-gradient(180deg,rgba(201,168,76,.6),transparent); display:block; }

  /* ══ INTRODUCCIÓN ══ */
  .intro-section {
    background: linear-gradient(180deg, var(--blue-deep) 0%, #0a1828 60%, var(--ink) 100%);
    padding: 100px 0 90px;
    position: relative;
    overflow: hidden;
  }
  .intro-section::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 55% 70% at 95% 30%, rgba(201,168,76,.07) 0%, transparent 60%),
      radial-gradient(ellipse 40% 50% at 5% 80%, rgba(26,107,107,.09) 0%, transparent 55%);
    pointer-events: none;
  }
  /* Decorative large quote mark background */
  .intro-section::after {
    content: '\201C';
    position: absolute;
    top: -2rem;
    right: 3%;
    font-family: 'Playfair Display', serif;
    font-size: clamp(14rem, 22vw, 22rem);
    font-weight: 900;
    color: rgba(201,168,76,.04);
    line-height: 1;
    pointer-events: none;
    user-select: none;
  }

  .intro-inner {
    display: grid;
    grid-template-columns: 1fr 1.6fr;
    gap: 5rem;
    align-items: start;
    position: relative;
  }
  @media(max-width:860px) {
    .intro-inner { grid-template-columns: 1fr; gap: 3rem; }
    .intro-aside { display: flex; flex-wrap: wrap; gap: 1rem; flex-direction: row; }
    .intro-aside-item { flex: 1 1 140px; }
  }

  /* Left column — aside / meta */
  .intro-aside {
    display: flex;
    flex-direction: column;
    gap: 2rem;
    position: sticky;
    top: 90px;
  }
  .intro-aside-item {
    background: rgba(245,240,232,.03);
    border: 1px solid rgba(201,168,76,.14);
    border-left: 3px solid rgba(201,168,76,.5);
    padding: 1.4rem 1.4rem 1.4rem 1.5rem;
    border-radius: 0 4px 4px 0;
    opacity: 0;
    transform: translateX(-18px);
    transition: opacity .6s ease, transform .6s ease, background .3s;
  }
  .intro-aside-item.visible { opacity: 1; transform: translateX(0); }
  .intro-aside-item:hover { background: rgba(201,168,76,.06); }
  .aside-icon { font-size: 1.3rem; margin-bottom: .6rem; display: block; }
  .aside-label {
    font-size: .6rem; font-weight: 700; letter-spacing: .28em;
    text-transform: uppercase; color: rgba(201,168,76,.55); margin-bottom: .3rem;
  }
  .aside-value {
    font-size: .88rem; line-height: 1.5; color: rgba(245,240,232,.75);
    font-weight: 600;
  }

  /* Right column — text */
  .intro-body { position: relative; }

  .intro-opening {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.3rem, 2.8vw, 1.9rem);
    font-weight: 400;
    font-style: italic;
    line-height: 1.55;
    color: var(--cream);
    margin-bottom: 2.5rem;
    padding-bottom: 2.5rem;
    border-bottom: 1px solid rgba(201,168,76,.18);
    opacity: 0;
    transform: translateY(22px);
    transition: opacity .7s ease .1s, transform .7s ease .1s;
  }
  .intro-opening.visible { opacity: 1; transform: translateY(0); }
  .intro-opening strong { color: var(--gold-light); font-style: normal; font-weight: 700; }

  .intro-paragraphs {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }
  .intro-p {
    font-size: .97rem;
    line-height: 1.85;
    color: rgba(245,240,232,.72);
    opacity: 0;
    transform: translateY(16px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .intro-p.visible { opacity: 1; transform: translateY(0); }
  .intro-p strong { color: rgba(245,240,232,.92); font-weight: 700; }
  .intro-p em { color: var(--gold-light); font-style: italic; }

  /* Objective pills */
  .intro-objectives {
    margin-top: 2.5rem;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity .6s ease .2s, transform .6s ease .2s;
  }
  .intro-objectives.visible { opacity: 1; transform: translateY(0); }
  .obj-label {
    font-size: .64rem; font-weight: 700; letter-spacing: .3em;
    text-transform: uppercase; color: var(--gold); margin-bottom: 1rem;
    display: flex; align-items: center; gap: .7rem;
  }
  .obj-label::after { content:''; flex:1; height:1px; background: linear-gradient(90deg, rgba(201,168,76,.35), transparent); }
  .obj-list {
    display: flex;
    flex-direction: column;
    gap: .7rem;
    list-style: none;
  }
  .obj-item {
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    font-size: .9rem;
    color: rgba(245,240,232,.7);
    line-height: 1.55;
  }
  .obj-bullet {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(201,168,76,.1);
    border: 1px solid rgba(201,168,76,.35);
    display: flex; align-items: center; justify-content: center;
    font-size: .62rem;
    font-weight: 700;
    color: var(--gold);
    margin-top: .15rem;
  }

  /* ── NAV ── */
  nav {
    position:sticky; top:0; z-index:200;
    background:rgba(13,13,20,.96); backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(201,168,76,.15);
    padding:0 2rem; display:flex; align-items:center;
    justify-content:space-between; height:60px;
  }
  .nav-left { display:flex; align-items:center; gap:1.2rem; }

  /* Student Card */
  .student-info-wrapper { position:relative; }
  .student-trigger {
    cursor:default; display:flex; align-items:center; gap:6px;
    font-family:'Playfair Display',serif; font-size:.95rem; font-weight:700;
    letter-spacing:.05em; transition:color .3s;
  }
  .student-trigger.cts-trigger { color:var(--gold); }
  .student-trigger.alumno-trigger { color:#5ec5c5; }
  .student-trigger svg { flex-shrink:0; opacity:.7; }
  .student-trigger:hover { opacity:.85; }

  .student-card {
    position:absolute; top:calc(100% + 14px); left:0;
    width:295px; background:rgba(8,6,2,.98);
    border:1px solid rgba(201,168,76,.28); padding:1.3rem 1.5rem;
    opacity:0; pointer-events:none; transform:translateY(-8px);
    transition:opacity .25s ease, transform .25s ease;
    z-index:9999; box-shadow:0 18px 52px rgba(0,0,0,.85);
  }
  .student-card.teal-card { border-color:rgba(26,107,107,.45); }
  .student-card::before {
    content:''; position:absolute; top:-6px; left:20px;
    width:10px; height:10px; background:rgba(8,6,2,.98);
    border-left:1px solid rgba(201,168,76,.28); border-top:1px solid rgba(201,168,76,.28);
    transform:rotate(45deg);
  }
  .student-card.teal-card::before { border-color:rgba(26,107,107,.45); }
  .student-info-wrapper:hover .student-card { opacity:1; pointer-events:auto; transform:translateY(0); }
  .student-card-title { font-size:.61rem; letter-spacing:.27em; text-transform:uppercase; color:var(--gold); margin-bottom:1rem; padding-bottom:.6rem; border-bottom:1px solid rgba(201,168,76,.18); font-weight:700; }
  .student-card.teal-card .student-card-title { color:#5ec5c5; border-bottom-color:rgba(26,107,107,.3); }
  .student-field { display:flex; flex-direction:column; margin-bottom:.75rem; }
  .student-field:last-child { margin-bottom:0; }
  .field-label { font-size:.57rem; letter-spacing:.15em; text-transform:uppercase; color:rgba(201,168,76,.5); margin-bottom:.15rem; font-weight:700; }
  .teal-card .field-label { color:rgba(94,197,197,.5); }
  .field-value { font-size:.88rem; color:rgba(245,240,232,.8); line-height:1.35; }
  .field-value a { color:var(--gold-light); text-decoration:none; }
  .field-value a:hover { text-decoration:underline; }

  /* Video nav link */
  .nav-video-link {
    display:flex; align-items:center; gap:5px;
    font-size:.7rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:rgba(245,240,232,.5); text-decoration:none;
    border:1px solid rgba(245,240,232,.12); padding:.3rem .8rem; border-radius:2px;
    transition:all .3s;
  }
  .nav-video-link:hover { color:var(--gold-light); border-color:rgba(201,168,76,.35); background:rgba(201,168,76,.06); }
  .nav-links { display:flex; gap:1.8rem; list-style:none; }
  .nav-links a { color:rgba(245,240,232,.65); text-decoration:none; font-size:.74rem; letter-spacing:.12em; text-transform:uppercase; font-weight:600; transition:color .3s; }
  .nav-links a:hover { color:var(--gold-light); }

  /* ── SECTIONS ── */
  section { padding:100px 0 80px; position:relative; }
  .container { max-width:1100px; margin:0 auto; padding:0 2rem; }
  .section-num { font-size:.7rem; letter-spacing:.4em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:.8rem; display:flex; align-items:center; gap:1rem; }
  .section-num::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,rgba(201,168,76,.4),transparent); max-width:120px; }
  .section-title { font-family:'Playfair Display',serif; font-size:clamp(2rem,4.5vw,3.4rem); font-weight:900; line-height:1.1; margin-bottom:1.8rem; }
  .section-title span { color:var(--gold-light); font-style:italic; }
  .section-lead { font-size:1.1rem; font-weight:300; line-height:1.8; color:rgba(245,240,232,.8); max-width:680px; margin-bottom:3rem; border-left:3px solid var(--gold); padding-left:1.5rem; }

  /* ── BANNER IMAGE ── */
  .img-banner { width:100%; height:280px; object-fit:cover; object-position:center 30%; display:block; border-radius:4px; margin-bottom:3rem; border:1px solid rgba(201,168,76,.15); filter:brightness(.75) saturate(.85); transition:filter .4s; }
  .img-banner:hover { filter:brightness(.95) saturate(1); }

  /* ── REVOLUCIÓN ── */
  #revolucion { background:var(--ink); }
  .rev-layout { display:grid; grid-template-columns:1.5fr 1fr; gap:3rem; align-items:start; margin-bottom:3rem; }
  @media(max-width:800px){ .rev-layout{ grid-template-columns:1fr; } }

  .timeline { position:relative; padding-left:2px; }
  .timeline::before { content:''; position:absolute; left:0; top:0; bottom:0; width:2px; background:linear-gradient(180deg,var(--gold),var(--teal),transparent); }
  .timeline-item { padding:0 0 3rem 2.5rem; position:relative; opacity:0; transform:translateX(-20px); transition:all .6s ease; }
  .timeline-item.visible { opacity:1; transform:translateX(0); }
  .timeline-dot { position:absolute; left:-7px; top:6px; width:16px; height:16px; border-radius:50%; background:var(--gold); border:3px solid var(--ink); box-shadow:0 0 12px rgba(201,168,76,.5); }
  .timeline-year { font-size:.7rem; font-weight:700; letter-spacing:.3em; color:var(--gold); text-transform:uppercase; margin-bottom:.4rem; }
  .timeline-h { font-family:'Playfair Display',serif; font-size:1.3rem; font-weight:700; margin-bottom:.6rem; color:var(--cream); }
  .timeline-p { font-size:.95rem; line-height:1.7; color:rgba(245,240,232,.7); }

  .side-imgs img { width:100%; border-radius:4px; border:1px solid rgba(201,168,76,.18); filter:sepia(25%) brightness(.8); transition:filter .4s; display:block; }
  .side-imgs img:hover { filter:sepia(0%) brightness(1); }
  .gallery-caption { font-size:.68rem; color:rgba(245,240,232,.38); letter-spacing:.1em; text-align:center; margin-top:.6rem; font-style:italic; }

  /* ── FIGURE CARDS ── */
  .figure-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(175px,1fr)); gap:1.5rem; margin-top:3rem; }
  .figure-card { background:rgba(245,240,232,.04); border:1px solid rgba(201,168,76,.15); border-radius:4px; overflow:hidden; text-align:center; opacity:0; transform:translateY(20px); transition:opacity .5s, transform .5s, background .3s, border-color .3s; }
  .figure-card.visible { opacity:1; transform:translateY(0); }
  .figure-card:hover { background:rgba(201,168,76,.08); border-color:rgba(201,168,76,.4); transform:translateY(-4px); }
  .figure-img { width:100%; height:155px; object-fit:cover; object-position:top; display:block; filter:sepia(30%) brightness(.82); transition:filter .4s; }
  .figure-card:hover .figure-img { filter:sepia(0%) brightness(1); }
  .figure-body { padding:1.1rem 1rem; }
  .figure-name { font-family:'Playfair Display',serif; font-size:1.05rem; font-weight:700; color:var(--cream); margin-bottom:.3rem; }
  .figure-dates { font-size:.7rem; color:var(--gold); font-weight:600; letter-spacing:.15em; margin-bottom:.5rem; }
  .figure-desc { font-size:.8rem; line-height:1.5; color:rgba(245,240,232,.6); }

  /* ── MODERNIDAD ── */
  #modernidad { background:linear-gradient(180deg,var(--ink) 0%,var(--blue-deep) 100%); }
  .img-gallery { display:grid; grid-template-columns:2fr 1fr 1fr; gap:1rem; margin-bottom:.5rem; }
  @media(max-width:700px){ .img-gallery{ grid-template-columns:1fr 1fr; } }
  .gallery-img { width:100%; height:195px; object-fit:cover; border-radius:3px; border:1px solid rgba(201,168,76,.12); filter:brightness(.78) saturate(.85); transition:all .4s; display:block; }
  .gallery-img:hover { filter:brightness(1) saturate(1.1); transform:scale(1.02); }

  .pillars-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:2rem; margin-top:2.5rem; }
  .pillar-card { position:relative; padding:2.5rem 2rem; border-radius:4px; overflow:hidden; opacity:0; transform:translateY(30px); transition:opacity .6s, transform .6s; }
  .pillar-card.visible { opacity:1; transform:translateY(0); }
  .pillar-card::before { content:''; position:absolute; inset:0; opacity:.06; transition:opacity .3s; }
  .pillar-card:hover::before { opacity:.1; }
  .pillar-card:nth-child(1){ background:rgba(201,168,76,.08); border:1px solid rgba(201,168,76,.25); }
  .pillar-card:nth-child(1)::before{ background:var(--gold); }
  .pillar-card:nth-child(2){ background:rgba(26,107,107,.1); border:1px solid rgba(26,107,107,.35); }
  .pillar-card:nth-child(2)::before{ background:var(--teal); }
  .pillar-card:nth-child(3){ background:rgba(184,74,47,.08); border:1px solid rgba(184,74,47,.3); }
  .pillar-card:nth-child(3)::before{ background:var(--rust); }
  .pillar-num { font-size:3.5rem; font-family:'Playfair Display',serif; font-weight:900; line-height:1; margin-bottom:1rem; }
  .pillar-card:nth-child(1) .pillar-num{ color:rgba(201,168,76,.3); }
  .pillar-card:nth-child(2) .pillar-num{ color:rgba(26,107,107,.4); }
  .pillar-card:nth-child(3) .pillar-num{ color:rgba(184,74,47,.35); }
  .pillar-h { font-family:'Playfair Display',serif; font-size:1.2rem; font-weight:700; margin-bottom:1rem; color:var(--cream); }
  .pillar-p { font-size:.92rem; line-height:1.75; color:rgba(245,240,232,.7); }
  .pillar-tag-inline { display:inline-block; margin-top:1.2rem; font-size:.68rem; font-weight:700; letter-spacing:.2em; text-transform:uppercase; padding:.3rem .8rem; border-radius:2px; }
  .pillar-card:nth-child(1) .pillar-tag-inline{ background:rgba(201,168,76,.15); color:var(--gold-light); }
  .pillar-card:nth-child(2) .pillar-tag-inline{ background:rgba(26,107,107,.2); color:#5ec5c5; }
  .pillar-card:nth-child(3) .pillar-tag-inline{ background:rgba(184,74,47,.2); color:#e88070; }

  .tech-examples { display:flex; flex-wrap:wrap; gap:.8rem; margin-top:3rem; }
  .tech-chip { background:rgba(245,240,232,.06); border:1px solid rgba(245,240,232,.12); border-radius:50px; padding:.45rem 1.1rem; font-size:.8rem; color:rgba(245,240,232,.7); font-weight:600; transition:all .3s; }
  .tech-chip:hover { background:rgba(201,168,76,.12); border-color:rgba(201,168,76,.3); color:var(--gold-light); }

  /* ── VIDEO ── */
  .video-section { background:linear-gradient(180deg,var(--blue-deep) 0%,rgba(13,13,20,.98) 100%); padding:80px 0; }
  .video-wrapper { max-width:860px; margin:0 auto; padding:0 2rem; }
  .video-label { font-size:.7rem; letter-spacing:.35em; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:1rem; display:flex; align-items:center; gap:.8rem; }
  .video-label::before { content:'▶'; width:26px; height:26px; border-radius:50%; background:rgba(201,168,76,.12); border:1px solid rgba(201,168,76,.3); display:inline-flex; align-items:center; justify-content:center; font-size:.65rem; }
  .video-title { font-family:'Playfair Display',serif; font-size:clamp(1.4rem,3vw,2rem); font-weight:700; margin-bottom:.8rem; color:var(--cream); }
  .video-desc { font-size:.9rem; color:rgba(245,240,232,.6); line-height:1.7; margin-bottom:2rem; max-width:680px; }
  .video-frame-wrap { position:relative; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:4px; border:1px solid rgba(201,168,76,.2); box-shadow:0 24px 80px rgba(0,0,0,.6); }
  .video-frame-wrap iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; }

  /* ── INSTITUCIONALIZACIÓN ── */
  #institucionalizacion { background:var(--blue-deep); }
  .inst-img { width:100%; height:200px; object-fit:cover; border-radius:4px; border:1px solid rgba(201,168,76,.15); filter:brightness(.75) saturate(.8); transition:filter .4s; display:block; margin-bottom:.6rem; }
  .inst-img:hover { filter:brightness(.95) saturate(1); }
  .inst-grid { display:grid; grid-template-columns:1fr 1fr; gap:3rem; align-items:start; }
  @media(max-width:700px){ .inst-grid{ grid-template-columns:1fr; } }
  .ins
